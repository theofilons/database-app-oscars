{% extends "base.html" %}
{% block content %}
    <h2 class="mb-4">Dashboard Analítico</h2>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">Top 5 Filmes com Mais Óscares</div>
                <div class="card-body">
                    <canvas id="chartFilmes"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">Evolução de Nomeações por Ano</div>
                <div class="card-body">
                    <canvas id="chartAnos"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ctx1 = document.getElementById('chartFilmes');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: {{ films_labels | safe }},
                datasets: [{
                    label: 'Número de Vitórias',
                    data: {{ films_data | safe }},
                    backgroundColor: 'rgba(255, 206, 86, 0.6)',
                    borderColor: 'rgba(255, 206, 86, 1)',
                    borderWidth: 1
                }]
            }
        });

        const ctx2 = document.getElementById('chartAnos');
        new Chart(ctx2, {
            type: 'line',
            data: {
                labels: {{ years_labels | safe }},
                datasets: [{
                    label: 'Total de Nomeações',
                    data: {{ years_data | safe }},
                    borderColor: 'rgba(54, 162, 235, 1)',
                    tension: 0.1
                }]
            }
        });
    </script>
{% endblock %}
